name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"      # Mondays 18:00 UTC
  push:
    tags: ["v*"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && \
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 3
          done
          echo "Stack did not become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Install Playwright Chromium and system dependencies
        working-directory: backend
        run: >
          ./mvnw -B exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run e2e tests
        working-directory: backend
        run: ./mvnw -B -Pe2e verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: backend/target/failsafe-reports

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Upload test results to Xray
        if: always()
        continue-on-error: true
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: junit
          testPaths: "backend/target/xray-reports/TEST-*.xml"
          projectKey: KARTY
          xrayCloud: true
