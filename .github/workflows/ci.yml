name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

      - name: Upload test results to Xray
        if: always()
        continue-on-error: true 
        uses: mikepenz/xray-action@v3
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: junit
          testPaths: "backend/target/surefire-reports/TEST-*.xml"
          projectKey: KARTY
          xrayCloud: true

      - name: Authenticate with SonarQube
        uses: SonarSource/sonarqube-auth-action@v1.2

      - name: SonarQube Analysis
        working-directory: backend
        run: >
          ./mvnw -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=tqs-kartylicious
          -Dsonar.projectKey=TQS-Kartylicious_Kartylicious
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true