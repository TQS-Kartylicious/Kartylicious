spring.application.name=kartylicious
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
fleet.mqtt.enabled=${FLEET_MQTT_ENABLED:false}
fleet.mqtt.url=${FLEET_MQTT_URL:tcp://localhost:1883}
payment.simulated.decline-user-id=${SIMULATED_PAYMENT_DECLINE_USER_ID:}
reservation.expiry.enabled=${RESERVATION_EXPIRY_ENABLED:true}
reservation.expiry.interval=${RESERVATION_EXPIRY_INTERVAL:30s}
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
admin.username=${ADMIN_USERNAME:}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
municipal.rules.maximum-reservation-duration-minutes=${MAXIMUM_RESERVATION_DURATION_MINUTES:60}
municipal.rules.maximum-ride-duration-minutes=${MAXIMUM_RIDE_DURATION_MINUTES:60}
municipal.rules.base-fare=${BASE_FARE:1.00}
municipal.rules.per-minute-rate=${PER_MINUTE_RATE:0.25}
municipal.rules.overtime-fee=${OVERTIME_FEE:2.00}
