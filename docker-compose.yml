services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAXIMUM_RESERVATION_DURATION_MINUTES: ${MAXIMUM_RESERVATION_DURATION_MINUTES:-60}
      MAXIMUM_RIDE_DURATION_MINUTES: ${MAXIMUM_RIDE_DURATION_MINUTES:-60}
      BASE_FARE: ${BASE_FARE:-1.00}
      PER_MINUTE_RATE: ${PER_MINUTE_RATE:-0.25}
      OVERTIME_FEE: ${OVERTIME_FEE:-2.00}
      FLEET_MQTT_ENABLED: ${FLEET_MQTT_ENABLED:-true}
      FLEET_MQTT_URL: tcp://mqtt:1883
      SIMULATED_PAYMENT_DECLINE_USER_ID: ${SIMULATED_PAYMENT_DECLINE_USER_ID:-}
      RESERVATION_EXPIRY_ENABLED: ${RESERVATION_EXPIRY_ENABLED:-true}
      RESERVATION_EXPIRY_INTERVAL: ${RESERVATION_EXPIRY_INTERVAL:-30s}
    networks:
      - default
      - fleet
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./fleet-simulator/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - fleet

  simulator:
    build: ./fleet-simulator
    depends_on:
      - mqtt
    environment:
      FLEET_SIMULATOR_FLEET: ${FLEET_SIMULATOR_FLEET:-}
      FLEET_SIMULATOR_RATE: ${FLEET_SIMULATOR_RATE:-10}
    networks:
      - fleet

networks:
  fleet:
    internal: true

volumes:
  pgdata:
